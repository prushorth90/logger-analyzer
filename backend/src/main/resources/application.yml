spring:
  application:
    name: log-analyzer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/log_analyzer}
    username: ${DB_USERNAME:log_analyzer}
    password: ${DB_PASSWORD:local_dev_password}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 2
        socketTimeout: 3
  jdbc:
    template:
      query-timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: log-analyzer-persistence-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: dev.loganalyzer.messaging
        spring.json.use.type.headers: true
    listener:
      ack-mode: record
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
  cache:
    type: redis
    cache-names: log-overview
    redis:
      time-to-live: 45s
      enable-statistics: true
      key-prefix: "log-analyzer:"
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
log-analyzer:
  opensearch:
    url: ${OPENSEARCH_URL:http://localhost:9200}
    index-name: ${OPENSEARCH_INDEX_NAME:logs-v1}
  ingestion:
    retry:
      max-attempts: ${LOG_INGESTION_MAX_ATTEMPTS:3}
      interval: ${LOG_INGESTION_RETRY_INTERVAL:2s}